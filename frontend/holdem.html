<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cache Money Casino - Texas Hold'em</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="centerToast" class="center-toast-stack" aria-live="polite"></div>
    <header class="topbar">
      <div class="logo">CACHE MONEY CASINO</div>
      <div class="balance" aria-live="polite">
        BANK: <span id="balance">$0</span>
        <span id="balanceDelta" class="balance-delta" aria-live="polite"></span>
      </div>
      <div class="account-controls">
        <button id="accountLink" class="btn ghost hidden">Account</button>
        <button id="signInBtn" class="btn ghost">Sign In</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel" id="holdem">
        <div class="panel-head">
          <h2>Texas Hold'em</h2>
          <a class="back-link" href="index.html" aria-label="Back to games"><span class="back-arrow" aria-hidden="true">&larr;</span><span>Back to Games</span></a>
        </div>
        <div class="multi-grid">
          <div class="multi-lobby" id="holdemLobby">
            <div class="multi-card">
              <h3>Create Table</h3>
              <div class="multi-create">
                <input id="holdemRoomName" type="text" placeholder="Table name (optional)" />
                <label class="auto-toggle auto-inline">
                  <input id="holdemPublic" type="checkbox" checked />
                  <span class="toggle-track"></span>
                  <span class="toggle-label">Public</span>
                </label>
                <button id="holdemCreate" class="btn">Create Table</button>
              </div>
            </div>

            <div class="multi-card">
              <h3>Public Tables</h3>
              <div class="multi-search">
                <input id="holdemSearchId" type="text" placeholder="Search by table ID or name" />
                <button id="holdemRefresh" class="btn ghost">Refresh</button>
              </div>
              <div id="holdemRooms" class="multi-room-list"></div>
            </div>
          </div>

          <div class="multi-room hidden" id="holdemRoom">
            <div id="holdemConnecting" class="multi-connecting hidden">
              <div class="multi-connecting-card">
                <div class="multi-connecting-title">Connecting to table...</div>
                <div class="multi-connecting-subtitle">Please wait</div>
              </div>
            </div>
            <div class="multi-room-header">
              <div class="multi-room-title">Room <span id="holdemRoomId">-</span></div>
              <div class="multi-invite multi-invite-inline">
                <div class="multi-invite-row">
                  <input id="holdemInvite" type="text" readonly />
                  <button id="holdemCopy" class="btn ghost">Copy</button>
                </div>
              </div>
              <button id="holdemLeave" class="btn ghost">Leave</button>
            </div>

            <div class="multi-table">
              <div class="multi-dealer">
                <h3>Community</h3>
                <div id="holdemCommunity" class="cards"></div>
                <div id="holdemPot" class="chip-stack"></div>
                <div id="holdemPotBreakdown" class="he-pot-breakdown"></div>
              </div>
              <div id="holdemPlayers" class="multi-players"></div>
            </div>

            <div class="multi-actions">
              <button id="holdemStart" class="btn">Start Round</button>
              <button id="holdemBet" class="btn">Check</button>
              <button id="holdemFold" class="btn">Fold</button>
            </div>

            <div class="multi-bet-row">
              <div class="multi-bet-label">Bet</div>
              <div id="holdemBetAmount" class="total-bet">$0</div>
              <div class="multi-bet-buttons" id="holdemBetButtons">
                <button class="chip" data-amount="5">$5</button>
                <button class="chip" data-amount="25">$25</button>
                <button class="chip" data-amount="50">$50</button>
                <button class="chip" data-amount="100">$100</button>
                <button id="holdemBetClear" class="btn ghost">Clear</button>
              </div>
            </div>
            <div id="holdemStatus" class="multi-status"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      For entertainment purposes only. Gamble responsibly with your imaginary chips.
    </footer>

    <div id="authBackdrop" class="modal-backdrop hidden"></div>
    <div id="authModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button type="button" class="modal-close" id="authClose" aria-label="Close">×</button>
        <h3 id="authTitle">Sign In</h3>
        <div id="authMessage" class="modal-message"></div>
        <form id="authForm">
          <input id="authUsername" type="text" placeholder="Username" autocomplete="username" />
          <div class="password-field">
            <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" />
            <button type="button" id="authTogglePassword" class="btn ghost small">Show</button>
          </div>
          <button type="submit" class="btn">Continue</button>
          <button type="button" id="authToggle" class="btn ghost">Create account</button>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script type="module" src="js/page-holdem.js"></script>
  </body>
</html>
