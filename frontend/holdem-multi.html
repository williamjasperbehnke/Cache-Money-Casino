<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cache Money Casino - Hold'em Live</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="centerToast" class="center-toast-stack" aria-live="polite"></div>
    <header class="topbar">
      <div class="logo">CACHE MONEY CASINO</div>
      <div class="balance" aria-live="polite">
        BANK: <span id="balance">$0</span>
        <span id="balanceDelta" class="balance-delta" aria-live="polite"></span>
      </div>
      <div class="account-controls">
        <button id="accountLink" class="btn ghost hidden">Account</button>
        <button id="signInBtn" class="btn ghost">Sign In</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel" id="holdem-multi">
        <div class="panel-head">
          <h2>Hold'em Live</h2>
          <a class="back-link" href="index.html" aria-label="Back to games"><span class="back-arrow" aria-hidden="true">&larr;</span><span>Back to Games</span></a>
        </div>
        <div class="bjmulti-grid">
          <div class="bjmulti-lobby" id="heMultiLobby">
            <div class="bjmulti-card">
              <h3>Create Table</h3>
              <div class="bjmulti-create">
                <input id="heMultiRoomName" type="text" placeholder="Table name (optional)" />
                <label class="auto-toggle auto-inline">
                  <input id="heMultiPublic" type="checkbox" checked />
                  <span class="toggle-track"></span>
                  <span class="toggle-label">Public</span>
                </label>
                <button id="heMultiCreate" class="btn">Create Table</button>
              </div>
            </div>

            <div class="bjmulti-card">
              <h3>Public Tables</h3>
              <div class="bjmulti-search">
                <input id="heMultiSearchId" type="text" placeholder="Search by table ID or name" />
                <button id="heMultiRefresh" class="btn ghost">Refresh</button>
              </div>
              <div id="heMultiRooms" class="bjmulti-room-list"></div>
            </div>
          </div>

          <div class="bjmulti-room hidden" id="heMultiRoom">
            <div id="heMultiConnecting" class="bjmulti-connecting hidden">
              <div class="bjmulti-connecting-card">
                <div class="bjmulti-connecting-title">Connecting to table...</div>
                <div class="bjmulti-connecting-subtitle">Please wait</div>
              </div>
            </div>
            <div class="bjmulti-room-header">
              <div class="bjmulti-room-title">Room <span id="heMultiRoomId">-</span></div>
              <div class="bjmulti-invite bjmulti-invite-inline">
                <div class="bjmulti-invite-row">
                  <input id="heMultiInvite" type="text" readonly />
                  <button id="heMultiCopy" class="btn ghost">Copy</button>
                </div>
              </div>
              <button id="heMultiLeave" class="btn ghost">Leave</button>
            </div>

            <div class="bjmulti-table">
              <div class="bjmulti-dealer">
                <h3>Community</h3>
                <div id="heMultiCommunity" class="cards"></div>
                <div id="heMultiPot" class="total">Pot: $0</div>
                <div id="heMultiPotBreakdown" class="he-pot-breakdown"></div>
              </div>
              <div id="heMultiPlayers" class="bjmulti-players"></div>
            </div>

            <div class="bjmulti-actions">
              <button id="heMultiStart" class="btn">Start Round</button>
              <button id="heMultiCheck" class="btn">Check</button>
              <button id="heMultiCall" class="btn">Call</button>
              <button id="heMultiRaise" class="btn">Raise</button>
              <button id="heMultiFold" class="btn">Fold</button>
            </div>

            <div class="bjmulti-bet-row">
              <div class="bjmulti-bet-label">Your Bet</div>
              <div id="heMultiBetAmount" class="total-bet">$0</div>
              <div class="bjmulti-bet-buttons" id="heMultiBetButtons">
                <button class="chip" data-amount="5">$5</button>
                <button class="chip" data-amount="25">$25</button>
                <button class="chip" data-amount="50">$50</button>
                <button class="chip" data-amount="100">$100</button>
                <button id="heMultiBetClear" class="btn ghost">Clear</button>
              </div>
            </div>
            <div id="heMultiStatus" class="bjmulti-status"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      For entertainment purposes only. Gamble responsibly with your imaginary chips.
    </footer>

    <div id="authBackdrop" class="modal-backdrop hidden"></div>
    <div id="authModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button type="button" class="modal-close" id="authClose" aria-label="Close">×</button>
        <h3 id="authTitle">Sign In</h3>
        <div id="authMessage" class="modal-message"></div>
        <form id="authForm">
          <input id="authUsername" type="text" placeholder="Username" autocomplete="username" />
          <div class="password-field">
            <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" />
            <button type="button" id="authTogglePassword" class="btn ghost small">Show</button>
          </div>
          <button type="submit" class="btn">Continue</button>
          <button type="button" id="authToggle" class="btn ghost">Create account</button>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script type="module" src="js/page-holdem-multi.js"></script>
  </body>
</html>
