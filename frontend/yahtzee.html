<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cache Money Casino - Yahtzee.exe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="centerToast" class="center-toast-stack" aria-live="polite"></div>
    <header class="topbar">
      <div class="logo">CACHE MONEY CASINO</div>
      <div class="balance" aria-live="polite">
        BANK: <span id="balance">$0</span>
        <span id="balanceDelta" class="balance-delta" aria-live="polite"></span>
      </div>
      <div class="account-controls">
        <button id="accountLink" class="btn ghost hidden">Account</button>
        <button id="signInBtn" class="btn ghost">Sign In</button>
      </div>
    </header>

    <main class="layout">
      <nav class="arcade-tabs" role="navigation">
        <a class="tab" href="poker.html">5-Card Poker</a>
        <a class="tab" href="holdem.html">Texas Hold'em</a>
        <a class="tab" href="blackjack.html">Blackjack</a>
        <a class="tab" href="roulette.html">Roulette</a>
        <a class="tab" href="craps.html">Craps</a>
        <a class="tab active" href="yahtzee.html">Yahtzee</a>
        <a class="tab" href="memory.html">Memory</a>
        <a class="tab" href="slots.html">Slots</a>
      </nav>

      <section class="panel" id="yahtzee">
        <h2>Yahtzee.exe</h2>
        <div class="bet-row">
          <label>Total Bet</label>
          <div id="yahtzeeBet" class="total-bet">$0</div>
          <button id="yahtzeeStart" class="btn">Start</button>
          <button id="yahtzeeClear" class="btn ghost">Clear Bet</button>
          <button id="yahtzeeRoll" class="btn">Roll</button>
          <div class="yahtzee-rolls">Rolls Left: <span id="yahtzeeRollsLeft">—</span></div>
        </div>
        <div class="chips" data-target="yahtzeeBet" id="yahtzeeChips">
          <button class="chip" data-amount="5">$5</button>
          <button class="chip" data-amount="10">$10</button>
          <button class="chip" data-amount="25">$25</button>
          <button class="chip" data-amount="50">$50</button>
          <button class="chip" data-amount="100">$100</button>
        </div>
        <div class="yahtzee-board">
          <div class="yahtzee-dice-panel">
            <div class="yahtzee-dice-label">Your Dice</div>
            <div class="yahtzee-dice" id="yahtzeeDice" aria-live="polite"></div>
            <div class="yahtzee-dice-label">Dealer Dice</div>
            <div class="yahtzee-dice dealer" id="yahtzeeDealerDice" aria-live="polite"></div>
          </div>
          <div class="yahtzee-scores">
            <div class="yahtzee-score-head">
              <span>Category</span>
              <span>You</span>
              <span>Dealer</span>
              <span>Action</span>
            </div>
            <div id="yahtzeeScores" class="yahtzee-score-body"></div>
            <div class="yahtzee-score-totals">
              <span>Total</span>
              <span id="yahtzeePlayerTotal">0</span>
              <span id="yahtzeeDealerTotal">0</span>
              <span></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      For entertainment purposes only. Gamble responsibly with your imaginary chips.
    </footer>

    <div id="authBackdrop" class="modal-backdrop hidden"></div>
    <div id="authModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button type="button" class="modal-close" id="authClose" aria-label="Close">×</button>
        <h3 id="authTitle">Sign In</h3>
        <div id="authMessage" class="modal-message"></div>
        <form id="authForm">
          <input id="authUsername" type="text" placeholder="Username" autocomplete="username" />
          <div class="password-field">
            <input
              id="authPassword"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
            />
            <button type="button" id="authTogglePassword" class="btn ghost small">Show</button>
          </div>
          <button type="submit" class="btn">Continue</button>
          <button type="button" id="authToggle" class="btn ghost">Create account</button>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/config.js"></script>
    <script type="module" src="js/page-yahtzee.js"></script>
  </body>
</html>
