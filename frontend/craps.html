<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cache Money Casino - Deadlock Dice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="centerToast" class="center-toast-stack" aria-live="polite"></div>
    <header class="topbar">
      <div class="logo">CACHE MONEY CASINO</div>
      <div class="balance" aria-live="polite">
        BANK: <span id="balance">$0</span>
        <span id="balanceDelta" class="balance-delta" aria-live="polite"></span>
      </div>
      <div class="account-controls">
        <button id="accountLink" class="btn ghost hidden">Account</button>
        <button id="signInBtn" class="btn ghost">Sign In</button>
      </div>
    </header>

    <main class="layout">
      <nav class="arcade-tabs" role="navigation">
        <a class="tab" href="poker.html">5-Card Poker</a>
        <a class="tab" href="holdem.html">Texas Hold'em</a>
        <a class="tab" href="blackjack.html">Blackjack</a>
        <a class="tab" href="roulette.html">Roulette</a>
        <a class="tab active" href="craps.html">Craps</a>
        <a class="tab" href="slots.html">Slots</a>
      </nav>

      <section class="panel" id="craps">
        <h2>Deadlock Dice</h2>
        <div class="bet-row">
          <label>Total Bet</label>
          <div id="crapsBet" class="total-bet">$0</div>
          <button id="crapsRoll" class="btn">Roll</button>
          <button id="crapsClear" class="btn ghost">Clear Bets</button>
        </div>
        <div class="craps-meta">
          <div id="crapsPoint" class="craps-pill">Point: --</div>
          <div id="crapsLastRoll" class="craps-pill">Last Roll: --</div>
        </div>
        <div class="craps-dice" aria-hidden="true">
          <div id="crapsDie1" class="craps-die" data-face="1">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          </div>
          <div id="crapsDie2" class="craps-die" data-face="1">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          </div>
        </div>
        <div class="chips" data-target="crapsBet">
          <button class="chip" data-amount="5">$5</button>
          <button class="chip" data-amount="10">$10</button>
          <button class="chip" data-amount="25">$25</button>
          <button class="chip" data-amount="50">$50</button>
        </div>
        <div class="craps-table">
          <div class="craps-zone pass" data-bet="pass">
            <div class="craps-title">Pass Line</div>
            <div class="craps-odds">Pays 1:1 on 7/11</div>
            <div class="chip-stack"></div>
          </div>
          <div class="craps-zone dont" data-bet="dont">
            <div class="craps-title">Don't Pass</div>
            <div class="craps-odds">Pays 1:1 on 2/3</div>
            <div class="chip-stack"></div>
          </div>
          <div class="craps-zone field" data-bet="field">
            <div class="craps-title">Field</div>
            <div class="craps-odds">2/12 pay 2:1</div>
            <div class="chip-stack"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      For entertainment purposes only. Gamble responsibly with your imaginary chips.
    </footer>

    <div id="authBackdrop" class="modal-backdrop hidden"></div>
    <div id="authModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button type="button" class="modal-close" id="authClose" aria-label="Close">×</button>
        <h3 id="authTitle">Sign In</h3>
        <div id="authMessage" class="modal-message"></div>
        <form id="authForm">
          <input id="authUsername" type="text" placeholder="Username" autocomplete="username" />
          <div class="password-field">
            <input
              id="authPassword"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
            />
            <button type="button" id="authTogglePassword" class="btn ghost small">Show</button>
          </div>
          <button type="submit" class="btn">Continue</button>
          <button type="button" id="authToggle" class="btn ghost">Create account</button>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script type="module" src="js/page-craps.js"></script>
  </body>
</html>
