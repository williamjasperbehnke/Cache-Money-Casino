<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cache Money Casino - Blackjack Live</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="centerToast" class="center-toast-stack" aria-live="polite"></div>
<header class="topbar">
  <div class="logo">CACHE MONEY CASINO</div>
  <div class="balance" aria-live="polite">
    BANK: <span id="balance">$0</span>
    <span id="balanceDelta" class="balance-delta" aria-live="polite"></span>
  </div>
  <div class="account-controls">
    <button id="accountLink" class="btn ghost hidden">Account</button>
    <button id="signInBtn" class="btn ghost">Sign In</button>
  </div>
</header>

    <main class="layout">
      <nav class="arcade-tabs" role="navigation">
        <a class="tab" href="poker.html">5-Card Poker</a>
        <a class="tab" href="holdem.html">Texas Hold'em</a>
        <a class="tab" href="blackjack.html">Blackjack</a>
        <a class="tab active" href="blackjack-multi.html">Blackjack Live</a>
        <a class="tab" href="roulette.html">Roulette</a>
        <a class="tab" href="craps.html">Craps</a>
        <a class="tab" href="yahtzee.html">Yahtzee</a>
        <a class="tab" href="memory.html">Memory</a>
        <a class="tab" href="slots.html">Slots</a>
      </nav>

      <section class="panel" id="blackjack-multi">
        <h2>Blackjack Live</h2>
        <div class="bjmulti-grid">
          <div class="bjmulti-lobby" id="bjMultiLobby">
            <div class="bjmulti-card">
              <h3>Create Room</h3>
              <div class="bjmulti-create">
                <input id="bjMultiRoomName" type="text" placeholder="Table name" />
                <label class="auto-toggle auto-inline">
                  <input id="bjMultiPublic" type="checkbox" checked />
                  <span class="toggle-track"></span>
                  <span class="toggle-label">Public lobby</span>
                </label>
                <button id="bjMultiCreate" class="btn">Create Room</button>
              </div>
            </div>

            <div class="bjmulti-card">
              <h3>Public Tables</h3>
              <div id="bjMultiRooms" class="bjmulti-room-list"></div>
              <button id="bjMultiRefresh" class="btn ghost">Refresh</button>
            </div>
          </div>

          <div class="bjmulti-room hidden" id="bjMultiRoom">
            <div class="bjmulti-room-header">
              <div class="bjmulti-room-title">
                Room <span id="bjMultiRoomId">-</span>
              </div>
              <button id="bjMultiLeave" class="btn ghost">Leave</button>
            </div>
            <div class="bjmulti-invite">
              <label>Invite link</label>
              <div class="bjmulti-invite-row">
                <input id="bjMultiInvite" type="text" readonly />
                <button id="bjMultiCopy" class="btn ghost">Copy</button>
              </div>
            </div>
            <div class="bjmulti-table">
              <div class="bjmulti-dealer">
                <h3>Dealer</h3>
                <div id="bjMultiDealer" class="cards"></div>
                <div id="bjMultiDealerTotal" class="total"></div>
              </div>
              <div id="bjMultiPlayers" class="bjmulti-players"></div>
            </div>
            <div class="bjmulti-actions">
              <button id="bjMultiStart" class="btn">Start Round</button>
              <button id="bjMultiHit" class="btn">Hit</button>
              <button id="bjMultiStand" class="btn">Stand</button>
              <button id="bjMultiDouble" class="btn">Double</button>
              <button id="bjMultiSplit" class="btn">Split</button>
            </div>
            <div class="bjmulti-bet-row">
              <div class="bjmulti-bet-label">Your Bet</div>
              <div id="bjMultiBetAmount" class="total-bet">$0</div>
              <div class="bjmulti-bet-buttons">
                <button class="chip" data-amount="5">$5</button>
                <button class="chip" data-amount="25">$25</button>
                <button class="chip" data-amount="50">$50</button>
                <button class="chip" data-amount="100">$100</button>
                <button id="bjMultiBetClear" class="btn ghost">Clear</button>
              </div>
            </div>
            <div id="bjMultiStatus" class="bjmulti-status"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
  For entertainment purposes only. Gamble responsibly with your imaginary chips.
</footer>

    <div id="authBackdrop" class="modal-backdrop hidden"></div>
    <div id="authModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button type="button" class="modal-close" id="authClose" aria-label="Close">×</button>
        <h3 id="authTitle">Sign In</h3>
        <div id="authMessage" class="modal-message"></div>
        <form id="authForm">
          <input id="authUsername" type="text" placeholder="Username" autocomplete="username" />
          <div class="password-field">
            <input
              id="authPassword"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
            />
            <button type="button" id="authTogglePassword" class="btn ghost small">Show</button>
          </div>
          <button type="submit" class="btn">Continue</button>
          <button type="button" id="authToggle" class="btn ghost">Create account</button>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script type="module" src="js/page-blackjack-multi.js"></script>
  </body>
</html>
